[pyprland]
plugins = ["shortcuts_menu", "toggle_special"]

# using variables for demonstration purposes (not needed)
[pyprland.variables]
float_term = "ghostty --class=com.hypr.float_win -e"
float_term_c = "ghostty --class=com.hypr.float_win"

# [scratchpads.term]
