exec-once = $bin/wrapped-hyprdynamicmonitors.sh

# # Monitors
# exec-once = $scripts/configure-monitors.sh
# exec-once = hyprland-monitor-attached $scripts/monitor-attached.sh $scripts/monitor-detached.sh

# Wallpaper
exec-once = swww-daemon -f xrgb &

# Bar
exec-once = hyprpanel &

# Input
exec-once = fcitx5 &

# Core
exec-once = /usr/libexec/polkit-agent-helper-1
exec-once = gnome-keyring-daemon --start --components=secrets
exec-once = hypridle
# exec-once = hyprsunset
# # exec-once = wayland-pipewire-idle-inhibit -w # TODO: Check if twitter playback is fixed in firefox
exec-once = dbus-update-activation-environment --systemd --all
# exec-once = hyprpm reload && hyprctl reload # Error with hyprpm in first run
# exec-once = hyprpm reload

exec-once = $bin/pypr &

# Clipboard
exec-once = wl-paste --type text --watch cliphist -max-items 20 store
exec-once = wl-paste --type image --watch cliphist -max-items 20 store

exec-once = sh -c 'dex -a -s /etc/xdg/autostart' &

# exec-shutdown = lock

# Cursor
exec-once = hyprctl setcursor Bibata-Modern-Classic 24

# permissions
permission = /usr/(bin|local/bin)/hyprpm, plugin, allow
