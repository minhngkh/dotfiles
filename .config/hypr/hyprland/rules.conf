windowrule {
  name = suppress-maximize
  suppress_event = maximize
  match:class = (.*)
}

# windowrulev2 = suppressevent maximize, class:(.*) # You'll probably like this

# Fullscreen indicator
windowrule {
  name = fullscreen-1
  border_color = rgb(bae6fd)
  match:fullscreen_state_client = 2
  match:fullscreen_state_internal = 0
}

windowrule {
  name = fullscreen-2
  border_color = rgb(fde68a)
  match:fullscreen_state_client = 1
  match:fullscreen_state_internal = 1
}

windowrule {
  name = fullscreen-3
  border_color = rgb(a7f3d0)
  match:fullscreen_state_client = 2
  match:fullscreen_state_internal = 1
}

# windowrulev2 = bordercolor rgb(bae6fd), fullscreenstate:0 2
# windowrulev2 = bordercolor rgb(fde68a), fullscreenstate:1 1
# windowrulev2 = bordercolor rgb(a7f3d0), fullscreenstate:1 2

# Border bug on apps that is not fully wayland compatible
# windowrulev2 = bordercolor rgb(ffffff) rgb(ffffff), class:^(SourceGit)$

# Blur
windowrule {
  name = vs-code
  opacity = 0.9
  match:class = ^(code)$
}

windowrule {
  name = zed
  opacity = 0.9
  match:class = ^(dev.zed.Zed)$
}

windowrule {
  name = ghostty
  opacity = 0.9
  match:class = ^(com.mitchellh.ghostty)$
}

# windowrulev2 = opacity 0.9, class:^(code)$
# windowrulev2 = opacity 0.88, class:^(kitty)
# windowrulev2 = opacity 0.88, class:^(com.mitchellh.ghostty)$
# windowrulev2 = opacity 0.9, class:^(dev.zed.Zed)
# windowrulev2 = opacity 0.97, class:^(jetbrains-rider)$

# Float
# windowrule {
#   name = float-anim
#   animation = gnomed
#   match:float = true
# }

windowrule {
  name = blueberry
  float = on
  center = on
  match:class = ^(blueberry.py)$
}

windowrule {
  name = fcitx5
  float = on
  center = on
  match:class = ^(org.fcitx.fcitx5-config-qt)$
}

windowrule {
  name = kde-file-manager
  center = on
  min_size = (monitor_w*0.5) (monitor_h*0.7)
  match:class = ^(org.freedesktop.impl.portal.desktop.kde)$
}

# windowrulev2 = animation gnomed, floating:1
# windowrulev2 = float, class:^(blueberry.py)$
# windowrulev2 = float, class:^(org.fcitx.fcitx5-config-qt)$
# windowrulev2 = size >50% >70%, class:^(org.freedesktop.impl.portal.desktop.kde)$

# float-win
windowrule {
  name = float-win
  float = on
  center = on
  match:class = ^(com.hypr.float_win)(.*)$
}

windowrule {
  name = v-large
  center = on
  size = (monitor_w*0.3) (monitor_h*0.7)
  match:class = ^(com.hypr.float_win_v_large)$
}

windowrule {
  name = h-large
  center = on
  size = (monitor_w*0.8) (monitor_h*0.9)
  match:class = ^(com.hypr.float_win_h_large)$
}

windowrule {
  name = h-mid
  size = (monitor_w*0.6) (monitor_h*0.7)
  match:class = ^(com.hypr.float_win_h_mid)$
}

# windowrulev2 = float, class:^(com.hypr.float_win)$
# windowrulev2 = size 30% 70%, class:^(com.hypr.float_win)$, title:^(hyprprop)$
# windowrulev2 = size 80% 90%, class:^(com.hypr.float_win)$, title:^(bpytop)$
# windowrulev2 = size 60% 70%, class:^(com.hypr.float_win)$

# Pip
windowrule {
  name = pip
  keep_aspect_ratio = on
  move = (monitor_w*0.73) (monitor_h*0.72)
  size = (monitor_w*0.25) (monitor_h*0.25)
  float = on
  pin = on

  match:title = ^(Picture(-| )in(-| )[Pp]icture)$
}

windowrule {
  name = file-picker
  float = on
  
  match:title = ^((Open File)|(Select a File)|(Open Folder)|(Save As)|(Library)|(File Upload))(.*)$
}

windowrule {
  name = spotify
  float = on
  workspace = special:music
  size = (monitor_w*0.9) (monitor_h*0.9)
  center = on
  
  match:initial_class = ^(spotify)$
}

# Notesnook
windowrulev2 = workspace special:note, title:^(Notesnook)$

windowrule {
  name = scratchpad
  size = (monitor_w*0.65) (monitor_h*0.8)
  float = on
  center = on
  
  match:workspace = special:term
}

# Popup focus
windowrulev2 = stayfocused, class:^(com.chatterino.chatterino)$, title:(Usercard)


# Workspace
workspace = special:term, on-created-empty:$terminal
workspace = special:music, on-created-empty:spotify-launcher
workspace = special:note, on-created-empty:notesnook

workspace = 1, monitor:HDMI-A-1
workspace = 2, monitor:HDMI-A-1
workspace = 3, monitor:HDMI-A-1
workspace = 4, monitor:HDMI-A-1
workspace = 5, monitor:HDMI-A-1
workspace = 6, monitor:HDMI-A-1
workspace = 7, monitor:HDMI-A-1
workspace = 8, monitor:eDP-1
workspace = 9, monitor:eDP-1
workspace = 10, monitor:eDP-1
