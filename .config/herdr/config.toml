onboarding = false

[theme]
name = "vesper"

auto_switch = false
[ui]
agent_panel_sort = "priority"
copy_on_select = false

status_indicators = "dots"
[experimental]
kitty_graphics = true

[ui.sidebar.agents]
rows = [
  ["state_icon", "terminal_title_stripped"],
  [{ token = "$flag", fg = "#f1fa8c", bold = true }, "workspace", { token = "$age", dim = true }],
]

# [ui.sidebar.spaces]
# rows = [
#   ["state_icon", "workspace", "$agents", { token = "$busy", dim = true }],
#   ["branch", "git_status"],
# ]

# Override herdr's built-in "new worktree" key (prefix+shift+g) with worktrunk's
# default-branch switch/create picker:
[[keys.command]]
key = "prefix+shift+g"
type = "plugin_action"
command = "worktrunk.open"
description = "Worktree: switch / create from default branch"

# Optional: bind current-branch creation separately.
[[keys.command]]
key = "prefix+shift+c"
type = "plugin_action"
command = "worktrunk.open-current"
description = "Worktrunk: switch / create from current branch"

[[keys.command]]
key = "prefix+shift+d"
type = "plugin_action"
command = "worktrunk.remove"
description = "Worktrunk: remove"

[[keys.command]]              # lazygit: open in a split
key = "prefix+g"
type = "plugin_action"
command = "herdr-lazygit.open"
description = "open lazygit"

# [[keys.command]]              # lazygit: open in its own tab
# key = "prefix+shift+g"
# type = "plugin_action"
# command = "herdr-lazygit.open-tab"
# description = "open lazygit in new tab"

[[keys.command]]
key = "prefix+m"
type = "shell"
description = "settle agent (slides to bottom of inbox)"
command = "herdr plugin action invoke settle --plugin herdr-agent-inbox"

[[keys.command]]
key = "prefix+shift+m"
type = "shell"
description = "mark agent unread (back to attention tier)"
command = "herdr plugin action invoke unread --plugin herdr-agent-inbox"

[[keys.command]]
key = "prefix+alt+m"
type = "shell"
description = "settle all finished agents in workspace"
command = "herdr plugin action invoke settle-workspace --plugin herdr-agent-inbox"

[[keys.command]]
key = "prefix+i"
type = "shell"
description = "open agent inbox popup"
command = "herdr plugin pane open --plugin herdr-agent-inbox --entrypoint inbox"

[[keys.command]]
key = "prefix+alt+right"
type = "shell"
description = "sidebar wider (+2 cols)"
command = "herdr plugin action invoke sidebar-grow --plugin herdr-agent-inbox"

[[keys.command]]
key = "prefix+alt+left"
type = "shell"
description = "sidebar narrower (-2 cols)"
command = "herdr plugin action invoke sidebar-shrink --plugin herdr-agent-inbox"

[[keys.command]]
key = "prefix+k"
type = "plugin_action"
command = "herdr-bar.open"
description = "command bar"

# --- added by Agent Usage (usagebar) setup ---
[ui.toast]
delivery = "system"

[ui.toast.herdr]
position = "bottom-left"

[ui.sound]
enabled = true
