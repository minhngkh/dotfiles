# ~/.config/worktrunk/config.toml
# worktree-path = "{{ repo_path }}/../{{ branch | sanitize }}"
worktree-path = "{{ repo_path }}/.worktrees/{{ branch | sanitize }}"

[commit.generation]
command = "opencode2 run --agent build --model opencode-go/mimo-v2.5"
template-append = """
- Use conventional commits (feat:, fix:, docs:, …)
- The title of the commit should be concise and not too much into impl detail
- The Body of commit should use bullet points that is not too complicated and to impl focus (if even need to write, omit the body for sipmle change commit)
"""

[pre-start]
setup = "{{ repo_path }}/../sync.sh || true"

[projects."dev.azure.com/prodbgsw/SAT/_git/SAT"]
post-start.install-fe = "cd ./src/frontend && npm install"
worktree-path = "{{ repo_path }}/../{{ branch | sanitize }}"

[projects."dev.azure.com/prodbgsw/Fabrik/_git/fabrick-*"]
pre-start.t3-default = "git config --local \"branch.$(git branch --show-current).gh-merge-base\" dev"
post-start.install-fe = "npm install"

[projects."dev.azure.com/prodbgsw/Fabrik/_git/fabrick-web-maintenance"]
post-start.link-fe = "npm run link:shared"

# [projects.""]
